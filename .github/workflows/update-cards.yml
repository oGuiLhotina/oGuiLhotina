name: Update README cards

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=oGuiLhotina&show_icons=true&hide_border=true&bg_color=0d0208&title_color=39ff14&icon_color=39ff14&text_color=00ff41
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=oGuiLhotina&layout=compact&hide_border=true&bg_color=0d0208&title_color=39ff14&text_color=00ff41
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: oGuiLhotina
          outputs: |
            profile/snake.svg?color_snake=%2339ff14&color_dots=%230d0208,%230a3d1f,%23146b2e,%231fa93f,%2339ff14
            profile/snake-light.svg?color_snake=%231a7f37&color_dots=%23ebedf0,%239be9a8,%2340c463,%2330a14e,%23216e39

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: atualizar cards de stats" || exit 0
          git push
